<svg width="512" height="512" viewBox="320 200 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gradRefine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00CFFF"/>
      <stop offset="100%" stop-color="#FF4FD8"/>
    </linearGradient>

    <filter id="softGlow">
      <feGaussianBlur stdDeviation="1.8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 主体路径（保留你结构但视觉顺滑化） -->
  <path d="
