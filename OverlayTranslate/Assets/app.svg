  "
  fill="none"
  stroke="url(#gradRefine)"
  stroke-width="3.5"
  stroke-linecap="round"
  stroke-linejoin="round"
  filter="url(#softGlow)"/>

  <!-- 小笔触（保留你第二段但优化） -->
